name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          fetch-depth: 0
      - name: Read immutable frontend ref
        id: frontend
        working-directory: backend
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          lock=Path('build/frontend.lock.yaml').read_text()
          ref=re.search(r'^ref: "([a-f0-9]{40})"$',lock,re.M)[1]
          repository=re.search(r'^repository: https://github.com/(.+)\.git$',lock,re.M)[1]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write(f'ref={ref}\nrepository={repository}\n')
            version=os.environ['GITHUB_REF_NAME'][1:] if os.environ['GITHUB_REF'].startswith('refs/tags/v') else '0.3.0'
            if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix')
            output.write(f'version={version}\n')
            output.write('build_time='+subprocess.check_output(['git','show','-s','--format=%cI','HEAD'],text=True).strip()+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.frontend.outputs.repository }}
          ref: ${{ steps.frontend.outputs.ref }}
          path: frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build the locked Hub UI
        working-directory: backend
        run: sh scripts/build-frontend.sh ../frontend
      - name: Frontend validation
        working-directory: frontend
        run: |
          pnpm --filter @metacubexd/ui typecheck
          pnpm --filter @metacubexd/ui test:unit
          pnpm --filter @metacubexd/ui exec playwright install --with-deps chromium
      - name: Backend validation
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal migrations tests)"
          go vet -tags=integration,frontend ./...
          go test -race -tags=integration,frontend ./... -timeout=180s
          sh scripts/generate-sql.sh
          git diff --exit-code -- internal/storage/generated
          test -z "$(git ls-files --others --exclude-standard internal/storage/generated)"
          python3 scripts/smoke-cli.py
          python3 scripts/check-compose.py
          MIHOMOHUB_EMBED_SMOKE=1 node scripts/smoke-setup.mjs ../frontend
          MIHOMOHUB_EMBED_SMOKE=1 node scripts/smoke-navigation.mjs ../frontend
          MIHOMOHUB_EMBED_SMOKE=1 node scripts/smoke-regressions.mjs ../frontend
          MIHOMOHUB_EMBED_SMOKE=1 node scripts/smoke-hub.mjs ../frontend
      - name: Build Linux amd64 and arm64 releases
        working-directory: backend
        run: |
          sh scripts/build-release.sh --prepared --frontend ../frontend --version "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build manual validation artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: backend
        run: sh scripts/build-release.sh --prepared --frontend ../frontend
      - uses: docker/setup-buildx-action@v3
      - name: Build both container platforms without publishing
        working-directory: backend
        run: |
          ref='${{ steps.frontend.outputs.ref }}'
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "VERSION=${{ steps.frontend.outputs.version }}" --build-arg "BACKEND_COMMIT=$GITHUB_SHA" --build-arg "FRONTEND_COMMIT=$ref" --build-arg "BUILD_TIME=${{ steps.frontend.outputs.build_time }}" --provenance=true --sbom=true --output type=oci,dest=dist/mihomo-hub-image.oci.tar .
          sha256sum dist/mihomo-hub-image.oci.tar >> dist/SHA256SUMS
      - name: Build and exercise a local container
        working-directory: backend
        run: |
          sh scripts/build-image.sh "dist/mihomo-hub_${{ steps.frontend.outputs.version }}_linux_amd64"
          python3 scripts/smoke-container.py --image "mihomo-hub:${{ steps.frontend.outputs.version }}"
      # 只有版本标签才上传镜像；手动运行仍只产出验证包。复用上一步 Buildx 缓存，
      # 在单测、浏览器、双架构构建及容器验收全部通过后发布。
      - name: Image tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            VERSION=${{ steps.frontend.outputs.version }}
            BACKEND_COMMIT=${{ github.sha }}
            FRONTEND_COMMIT=${{ steps.frontend.outputs.ref }}
            BUILD_TIME=${{ steps.frontend.outputs.build_time }}
          provenance: true
          sbom: true
      - name: Record published image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo 'Published container image:'
            echo '```text'
            echo "$TAGS"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-hub-release-candidate
          path: |
            backend/dist/*.tar.gz
            backend/dist/*.oci.tar
            backend/dist/SHA256SUMS
            backend/test-results/
          retention-days: 14
