services:
  mihomo-hub:
    image: ${MIHOMOHUB_IMAGE:-ghcr.io/longafterx/mihomo-hub:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MIHOMOHUB_PORT:-11235}:8080"
    environment:
      MIHOMOHUB_PUBLIC_ORIGIN: ${MIHOMOHUB_PUBLIC_ORIGIN:-http://127.0.0.1:${MIHOMOHUB_PORT:-11235}}
    volumes:
      - hub-data:/var/lib/mihomo-hub
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 512m
    pids_limit: 128
volumes:
  hub-data:
